<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMax slice">
  <rect width="1200" height="500" fill="none"/>

  <!-- sky glow -->
  <circle cx="600" cy="80" r="220" fill="#ffffff" opacity="0.05"/>

  <!-- back buildings -->
  <g opacity="0.14" fill="#ffffff">
    <rect x="40" y="200" width="150" height="260"/>
    <rect x="210" y="160" width="130" height="300"/>
    <rect x="860" y="180" width="140" height="280"/>
    <rect x="1020" y="140" width="150" height="320"/>
  </g>

  <!-- ground -->
  <rect x="0" y="430" width="1200" height="70" fill="#ffffff" opacity="0.08"/>

  <!-- restaurant facade -->
  <g>
    <rect x="330" y="190" width="540" height="270" fill="#ffffff" opacity="0.16"/>
    <!-- roofline -->
    <rect x="310" y="170" width="580" height="30" fill="#ffffff" opacity="0.22"/>

    <!-- awning -->
    <path d="M330 230 L870 230 L900 290 L300 290 Z" fill="#ffffff" opacity="0.2"/>
    <g fill="#ffffff" opacity="0.28">
      <path d="M300 290 L336 290 L330 230 L306 230 Z"/>
      <path d="M372 290 L408 290 L396 230 L366 230 Z"/>
      <path d="M444 290 L480 290 L462 230 L426 230 Z"/>
      <path d="M516 290 L552 290 L528 230 L486 230 Z"/>
      <path d="M588 290 L624 290 L594 230 L558 230 Z"/>
      <path d="M660 290 L696 290 L660 230 L630 230 Z"/>
      <path d="M732 290 L768 290 L726 230 L702 230 Z"/>
      <path d="M804 290 L840 290 L792 230 L774 230 Z"/>
      <path d="M864 290 L900 290 L858 230 L846 230 Z"/>
    </g>

    <!-- door -->
    <rect x="570" y="330" width="60" height="130" fill="#ffffff" opacity="0.26"/>
    <!-- windows -->
    <rect x="380" y="330" width="130" height="90" fill="#ffffff" opacity="0.22"/>
    <rect x="690" y="330" width="130" height="90" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- outdoor tables -->
  <g fill="#ffffff" opacity="0.22">
    <circle cx="430" cy="430" r="26"/>
    <rect x="422" y="430" width="16" height="30"/>
    <circle cx="770" cy="430" r="26"/>
    <rect x="762" y="430" width="16" height="30"/>
  </g>

  <!-- sign -->
  <rect x="560" y="140" width="80" height="26" rx="4" fill="#ffffff" opacity="0.3"/>
</svg>
